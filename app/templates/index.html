{% extends "base.html" %}

{% block title %}Pflanzenschutz · Dokumentation{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
{% endblock %}

{% block body %}
<div id="psm-vue-app" hidden></div>
<header id="psm-vue-header"></header>
<div class="nav-overlay" id="psm-vue-overlay"></div>

<div class="app">
  <nav id="psm-vue-nav"></nav>

  <main>
    <div id="tab-home" class="tab active"></div>

    <div id="tab-betrieb" class="tab"></div>

    <div id="tab-psm" class="tab"></div>

    <div id="tab-einsatzorte" class="tab"></div>

    <div id="tab-kulturen" class="tab"></div>

    <div id="tab-export" class="tab"></div>

    <div id="tab-history" class="tab"></div>

    <div id="tab-forecast" class="tab"></div>
 
    <div id="tab-inventory" class="tab"></div>
    <div id="tab-meldungen" class="tab"></div>
    <div id="tab-settings" class="tab"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-psm"></div>

<div class="modal-overlay" id="modal-einsatzort"></div>

<div class="modal-overlay" id="modal-ort"></div>

<div class="modal-overlay" id="modal-map"></div>

<div class="modal-overlay" id="modal-kultur"></div>

<div class="modal-overlay" id="modal-betrieb-wizard"></div>

<div class="modal-overlay" id="modal-inventory"></div>

<div id="toast"></div>
{% endblock %}

{% block scripts %}
<script type="application/json" id="psm-bootstrap-data">
  {
    "user": {
      "username": {{ current_user.username | tojson }},
      "avatar": {{ (current_user.username[0] | upper) | tojson }}
    },
    "permissions": {{ permissions | tojson }},
    "assets": {
      "logo": {{ url_for('pages.media', filename='logo.png') | tojson }}
    }
  }
</script>
<script type="module" src="{{ vite_asset('src/main.js') }}"></script>

{% endblock %}
