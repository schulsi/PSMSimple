<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="csp-nonce" content="{{ csp_nonce }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pflanzenschutz{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('pages.media', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages-history.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages-home.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/utilities.css') }}">

  <link rel="manifest" href="{{ url_for('static', filename='misc/manifest.json') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='media/apple-touch-icon.png') }}">

  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
