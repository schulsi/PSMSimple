services:
  app:
    image: ghcr.io/schulsi/psmsimple:latest@sha256:4369d051ae196d66e63ed8d8ef2dcdeaa3ca7804dc17b889c156158ec89c562d
    container_name: psmsimple-app
    ports:
      - "8080:8000"
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY}
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - AUTH_MODE=${AUTH_MODE}
      # OIDC configuration
      # - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME}
      # - OIDC_ISSUER=${OIDC_ISSUER}
      # - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - OIDC_SCOPES=${OIDC_SCOPES}
      # - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE}
      # - OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION}
    volumes:
      - ./data:/data
      - ./data/logs:/data/logs
      - ./data/databases:/data/databases
      - ./data/exports:/data/exports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - psmsimple-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: psmsimple-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - psmsimple-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  psmsimple-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
