[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".git",
  ".github",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "Include",
  "Lib",
  "Scripts",
  "data",
  "migrations/versions",
  "share",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]
